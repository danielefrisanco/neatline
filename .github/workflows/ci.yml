name: check

on:
  push:
    branches: [main, master]
  pull_request:
  # Callable, so `auto-merge` gates on this exact job rather than on a copy of
  # it that can drift. One definition of "the checks passed".
  workflow_call:

jobs:
  check:
    # Not twice for the same commit.
    #
    # `auto-merge` runs these checks on the push and opens the pull request
    # afterwards — so a pull request opened by the bot arrives with its commit
    # already checked, and the `pull_request` trigger would run the whole matrix
    # again on exactly the same tree. Worse than wasteful: GitHub holds a run
    # from a bot-authored pull request for a maintainer's approval, so the
    # duplicate sat there and eventually expired, which reads like a failure.
    #
    # A pull request opened by a person still gets checked, which is the case
    # this trigger exists for.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the floor `engines` promises and the floor vitest needs —
        # vitest 4 depends on rolldown, which imports `styleText` from
        # node:util, added in 20.12. Keeping the two in step means CI is
        # testing the claim the package actually makes.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds the data, typechecks, tests, builds both module systems, and
      # verifies every export path resolves — the same gate as `prepublishOnly`.
      - run: npm run check
