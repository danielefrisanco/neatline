name: check

# No `pull_request` trigger, and that is the fix rather than an omission.
#
# Every pull request here is opened by `auto-merge` using `GITHUB_TOKEN`, and
# **GitHub will not let a token-opened pull request trigger workflows** — it is
# the loop guard that stops an action from setting itself off for ever. What it
# does instead of skipping is create a run and fail it before any job starts, so
# each of these arrived with a red cross, zero jobs, and no log to read. Six of
# them in a row, next to the same commits whose real checks were green.
#
# A job-level `if:` cannot help: the run dies before it is evaluated. So the
# trigger goes. Nothing is lost, because `auto-merge` runs this exact workflow on
# every push to every branch — the same job, the same matrix, on the same commit
# — and the pull request it opens carries those results.
#
# **Bring it back for the first outside contribution.** A pull request from a
# fork pushes nothing to this repository, so `auto-merge` never sees it and it
# would arrive unchecked. That is the case this trigger was for, and there has
# not been one yet.
on:
  push:
    branches: [main, master]
  # Callable, so `auto-merge` gates on this exact job rather than on a copy of
  # it that can drift. One definition of "the checks passed".
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the floor `engines` promises and the floor vitest needs —
        # vitest 4 depends on rolldown, which imports `styleText` from
        # node:util, added in 20.12. Keeping the two in step means CI is
        # testing the claim the package actually makes.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds the data, typechecks, tests, builds both module systems, and
      # verifies every export path resolves — the same gate as `prepublishOnly`.
      - run: npm run check
