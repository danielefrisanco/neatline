<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>neatline</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1><a href="https://danielefrisanco.github.io/neatline">neatline</a></h1>
      <p class="tagline">A region and a stylesheet, as a standalone SVG map.</p>
      <nav class="by">
        <!-- Both leave the tool, so both open beside it: someone in the middle
             of building a map should not lose it to a click on a byline.
             `noopener` because a new tab gets a handle back otherwise. -->
        <a href="https://danielefrisanco.github.io/" rel="me noopener" target="_blank">Daniele Frisanco</a>
        <a href="https://github.com/danielefrisanco/neatline" rel="noopener" target="_blank">Source</a>
      </nav>
    </header>

    <div class="layout">
      <!-- Rebuilt from the config on every change. Empty here: a form written
           twice, once in markup and once in code, is a form that drifts. -->
      <form id="form" class="panel" autocomplete="off"></form>

      <main class="stage">
        <figure id="map" class="map" aria-busy="true"></figure>
        <p id="status" class="status" role="status">Loading the map data…</p>
        <label class="share">
          <span class="field-label">Link to this map</span>
          <input id="share" type="text" readonly spellcheck="false" />
        </label>
        <!-- Actions rather than options, so they live beside the map instead of
             in the form: nothing here changes what is drawn. -->
        <div class="export">
          <button id="save-svg" type="button" class="action" disabled>Download SVG</button>
          <button id="save-png" type="button" class="action" disabled>Download PNG</button>
          <span class="export-size">
            <label class="field-hint" for="export-scale">PNG size</label>
            <select id="export-scale"></select>
          </span>
          <span class="field-hint">The SVG is vector and has no size of its own.</span>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
