  <title>Map of Western Europe</title>
  <style>
    .mp.mp-t-0yv5uje {
      --bg: transparent;
      --land: #D8D8D2;
      --land-edge: #FFFFFF;
      --border: #94948C;
      --border-width: 0.75;
      --accent: #C2482F;
      --accent-edge: #FFFFFF;
      --ink: #2B2B29;
      --ink-muted: #80807A;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --label-size: 13;
      --water: #C8D6DC;
      --road: #B08A3E;
      --neighbour: #F0F0EE;
      --anno: #C2482F;
      --anno-ink: #FFFFFF;
      --furniture-ink: #80807A;
    }
    .mp.mp-t-0yv5uje .mp-bg {
      fill: var(--bg);
    }
    .mp.mp-t-0yv5uje .mp-country {
      fill: var(--land);
      stroke: var(--land-edge);
      stroke-width: 0.5;
      stroke-linejoin: round;
    }
    .mp.mp-t-0yv5uje .mp-country.is-highlighted {
      fill: var(--accent);
      stroke: var(--accent-edge);
    }
    .mp.mp-t-0yv5uje .mp-border {
      fill: none;
      stroke: var(--border);
      stroke-width: var(--border-width);
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .mp.mp-t-0yv5uje .mp-neighbour {
      fill: var(--neighbour);
      stroke: none;
    }
    .mp.mp-t-0yv5uje .mp-water {
      fill: var(--water);
      stroke: none;
    }
    .mp.mp-t-0yv5uje .mp-road {
      fill: none;
      stroke: var(--road);
    }
    .mp.mp-t-0yv5uje .mp-label {
      fill: var(--ink);
      font-family: var(--font);
      font-size: var(--label-size);
    }
    .mp.mp-t-0yv5uje {
      --bg: #0E1620;
      --land: #22303F;
      --land-edge: #0E1620;
      --border: #4A5F73;
      --accent: #E0794B;
      --accent-edge: #0E1620;
      --ink: #DCE5ED;
      --ink-muted: #7B8B9C;
      --water: #16222E;
      --road: #C08A4A;
      --neighbour: #17222D;
      --anno: #E0794B;
      --anno-ink: #0E1620;
      --furniture-ink: #7B8B9C;
    }
  </style>
