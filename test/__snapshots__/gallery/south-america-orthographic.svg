<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" preserveAspectRatio="xMidYMid meet" class="mp mp-t-0i55d3t" role="img" aria-label="Map of South America">
  <title>Map of South America</title>
  <style>
    .mp.mp-t-0i55d3t {
      --bg: #A8C0CC;
      --land: #F2EAD8;
      --land-edge: #C9BFA6;
      --border: #6E6152;
      --border-width: 1.4;
      --accent: #8C3B4A;
      --accent-edge: #F2EAD8;
      --ink: #3A342A;
      --ink-muted: #7A7263;
      --font: ui-serif, Georgia, "Times New Roman", serif;
      --label-size: 13;
      --water: #A8C0CC;
      --road: #B5462F;
      --neighbour: #E6DEC9;
      --anno: #8C3B4A;
      --anno-ink: #F2EAD8;
      --furniture-ink: #7A7263;
    }
    .mp.mp-t-0i55d3t .mp-bg {
      fill: var(--bg);
    }
    .mp.mp-t-0i55d3t .mp-country {
      fill: var(--land);
      stroke: var(--land-edge);
      stroke-width: 0.8;
      stroke-linejoin: round;
    }
    .mp.mp-t-0i55d3t .mp-country.is-highlighted {
      fill: var(--accent);
      stroke: var(--accent-edge);
      stroke-width: 1;
    }
    .mp.mp-t-0i55d3t .mp-border {
      fill: none;
      stroke: var(--border);
      stroke-width: var(--border-width);
      stroke-dasharray: 5 2.5;
      stroke-linecap: round;
    }
    .mp.mp-t-0i55d3t .mp-neighbour {
      fill: var(--neighbour);
      stroke: none;
    }
    .mp.mp-t-0i55d3t .mp-water {
      fill: var(--water);
      stroke: none;
    }
    .mp.mp-t-0i55d3t .mp-road {
      fill: none;
      stroke: var(--road);
    }
    .mp.mp-t-0i55d3t .mp-label {
      fill: var(--ink);
      font-family: var(--font);
      font-size: var(--label-size);
    }
  </style>
