<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" preserveAspectRatio="xMidYMid meet" class="mp mp-t-0361zqa" role="img" aria-label="Where we operate">
  <title>Where we operate</title>
  <style>
    .mp.mp-t-0361zqa {
      --bg: transparent;
      --land: #D8D8D2;
      --land-edge: #FFFFFF;
      --border: #94948C;
      --border-width: 0.75;
      --accent: #C2482F;
      --accent-edge: #FFFFFF;
      --place: #2B2B29;
      --ink: #2B2B29;
      --ink-muted: #80807A;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --label-size: 13;
      --water: #C8D6DC;
      --road: #B08A3E;
      --neighbour: #F0F0EE;
      --anno: #C2482F;
      --anno-ink: #FFFFFF;
      --furniture-ink: #80807A;
    }
    .mp.mp-t-0361zqa .mp-bg {
      fill: var(--bg);
    }
    .mp.mp-t-0361zqa .mp-country {
      fill: var(--land);
      stroke: var(--land-edge);
      stroke-width: 0.5;
      stroke-linejoin: round;
    }
    .mp.mp-t-0361zqa .mp-country.is-highlighted {
      fill: var(--accent);
      stroke: var(--accent-edge);
    }
    .mp.mp-t-0361zqa .mp-border {
      fill: none;
      stroke: var(--border);
      stroke-width: var(--border-width);
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .mp.mp-t-0361zqa .mp-neighbour {
      fill: var(--neighbour);
      stroke: none;
    }
    .mp.mp-t-0361zqa .mp-water[data-kind="lake"] {
      fill: var(--water);
      stroke: none;
    }
    .mp.mp-t-0361zqa .mp-water[data-kind="river"] {
      fill: none;
      stroke: var(--water);
      stroke-width: 0.8;
    }
    .mp.mp-t-0361zqa .mp-place {
      fill: var(--place);
      stroke: none;
    }
    .mp.mp-t-0361zqa .mp-road {
      fill: none;
      stroke: var(--road);
    }
    .mp.mp-t-0361zqa .mp-label {
      fill: var(--ink);
      font-family: var(--font);
      font-size: var(--label-size);
    }
    .mp.mp-t-0361zqa {
      --land: #0B5D3B;
      --land-edge: #F4F1E8;
      --bg: #F4F1E8;
    }
  </style>
